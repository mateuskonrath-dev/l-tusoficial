<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Idiomas - Lótus</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; padding: 20px; background: #f5f5f5; }
        .test-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #0f3b28; margin-bottom: 30px; }
        .language-buttons { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; border: 2px solid #0f3b28; background: white; color: #0f3b28; border-radius: 4px; transition: all 0.3s; }
        button:hover { background: #0f3b28; color: white; }
        button.active { background: #0f3b28; color: white; }
        .test-section { margin-bottom: 30px; border: 1px solid #ddd; padding: 20px; border-radius: 4px; }
        .test-section h3 { color: #0f3b28; margin-top: 0; }
        .test-key { font-size: 12px; color: #666; font-family: monospace; margin-bottom: 5px; }
        .translation { font-size: 16px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0f3b28; margin-top: 5px; }
        .error { color: red; }
        .success { color: green; }
        #console-log { background: #222; color: #0f0; padding: 15px; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; margin-top: 20px; }
        .log-entry { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Teste de Sistema de Idiomas - Lótus Calçados</h1>

        <div class="language-buttons">
            <button onclick="testLanguage('pt')">🇧🇷 Português</button>
            <button onclick="testLanguage('en')">🇺🇸 English</button>
            <button onclick="testLanguage('de')">🇩🇪 Deutsch</button>
            <button onclick="testLanguage('fr')">🇫🇷 Français</button>
            <button onclick="testLanguage('es')">🇪🇸 Español</button>
            <button onclick="testLanguage('it')">🇮🇹 Italiano</button>
        </div>

        <div class="test-section">
            <h3>📋 Traduções Carregadas</h3>
            <div id="translations-loaded">Carregando...</div>
        </div>

        <div class="test-section">
            <h3>🌍 Testando Chaves Principais</h3>
            <div id="test-keys">
                <div class="test-key">nav-home</div>
                <div id="nav-home" class="translation">-</div>

                <div class="test-key">hero-title</div>
                <div id="hero-title" class="translation">-</div>

                <div class="test-key">about-title</div>
                <div id="about-title" class="translation">-</div>

                <div class="test-key">social-title</div>
                <div id="social-title" class="translation">-</div>

                <div class="test-key">sus-title</div>
                <div id="sus-title" class="translation">-</div>

                <div class="test-key">why-lotus-title</div>
                <div id="why-lotus-title" class="translation">-</div>

                <div class="test-key">info-title</div>
                <div id="info-title" class="translation">-</div>

                <div class="test-key">form-name</div>
                <div id="form-name" class="translation">-</div>
            </div>
        </div>

        <div class="test-section">
            <h3>📊 Console Log</h3>
            <div id="console-log"></div>
        </div>
    </div>

    <script>
        let translations = {};
        const consoleLogs = [];

        // Intercept console.log
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args);
            const message = args.join(' ');
            consoleLogs.push(message);
            updateConsoleLogs();
        };

        const originalError = console.error;
        console.error = function(...args) {
            originalError(...args);
            const message = '❌ ' + args.join(' ');
            consoleLogs.push(message);
            updateConsoleLogs();
        };

        function updateConsoleLogs() {
            const logDiv = document.getElementById('console-log');
            logDiv.innerHTML = consoleLogs.slice(-20).map(log => `<div class="log-entry">${log}</div>`).join('');
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`./locales/${lang}.json`);
                if (!response.ok) throw new Error(`Could not load ${lang} translations`);
                translations = await response.json();
                console.log(`✅ Translations loaded for ${lang}: ${Object.keys(translations).length} keys`);
                updateDisplay();
                return translations;
            } catch (error) {
                console.error(`❌ Translation error for ${lang}: ${error.message}`);
                if (lang !== 'pt') {
                    console.log(`🔄 Fallback to Portuguese...`);
                    return loadTranslations('pt');
                }
                return {};
            }
        }

        function updateDisplay() {
            const testKeys = ['nav-home', 'hero-title', 'about-title', 'social-title', 'sus-title', 'why-lotus-title', 'info-title', 'form-name'];

            testKeys.forEach(key => {
                const el = document.getElementById(key);
                if (el && translations[key]) {
                    el.textContent = translations[key];
                    el.classList.add('success');
                } else if (el) {
                    el.textContent = '⚠️ Não encontrado';
                    el.classList.add('error');
                }
            });

            // Update translations loaded count
            const count = Object.keys(translations).length;
            document.getElementById('translations-loaded').innerHTML = `
                <span class="success">✅ ${count} chaves de tradução carregadas</span>
            `;

            // Update active button
            const langCode = localStorage.getItem('lotus-lang') || 'pt';
            document.querySelectorAll('.language-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`button[onclick*="'${langCode}'"]`)?.classList.add('active');
        }

        async function testLanguage(lang) {
            console.log(`🔄 Mudando para idioma: ${lang}`);
            await loadTranslations(lang);
            localStorage.setItem('lotus-lang', lang);
        }

        // Initialize with Portuguese
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Teste de Idiomas Iniciado');
            testLanguage('pt');
        });
    </script>
</body>
</html>
